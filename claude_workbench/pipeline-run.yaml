---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyter-pipeline
  labels:
    app: jupyter-datascience-claude

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jupyter-pipeline-edit
  labels:
    app: jupyter-datascience-claude
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: jupyter-pipeline

---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: jupyter-datascience-claude-
  labels:
    app: jupyter-datascience-claude
    tekton.dev/pipeline: jupyter-datascience-claude-pipeline
spec:
  pipelineRef:
    name: jupyter-datascience-claude-pipeline
  params:
    - name: git-url
      value: https://github.com/nstrug/claude_in_jupyter.git
    - name: git-revision
      value: main
    - name: context-dir
      value: claude_workbench
    - name: image-name
      value: jupyter-datascience-claude
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: jupyter-pipeline-workspace
  serviceAccountName: jupyter-pipeline
